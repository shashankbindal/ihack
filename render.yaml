services:
  - type: web
    name: ihack
    runtime: python
    plan: free
    region: singapore
    rootDir: prototype
    buildCommand: pip install -r requirements-app.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
