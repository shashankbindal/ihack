services:
  - type: web
    name: ihack
    runtime: python
    plan: free
    region: singapore
    rootDir: prototype
    buildCommand: pip install -r requirements-app.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ALLOWED_ORIGINS
        value: https://ihack.shashankbindal.me,http://localhost:5173,http://127.0.0.1:5173
